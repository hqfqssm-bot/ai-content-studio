<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:12px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.brand{text-align:center;margin-bottom:28px}
.logo{width:48px;height:48px;background:#6366f1;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:#fff;font-weight:800;font-size:20px}
.brand h1{font-size:20px;font-weight:700}
.brand p{font-size:13px;color:#64748b;margin-top:4px}
.tabs{display:flex;background:#f1f5f9;border-radius:8px;padding:3px;margin-bottom:24px}
.tab{flex:1;padding:10px;text-align:center;font-weight:600;font-size:13px;border-radius:6px;border:none;background:none;color:#64748b}
.tab.active{background:#fff;color:#1e293b;box-shadow:0 1px 3px rgba(0,0,0,.1)}
input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;margin-bottom:16px}
button{width:100%;padding:14px;background:#6366f1;color:#fff;border:none;border-radius:8px;font-weight:600;font-size:15px;cursor:pointer}
</style></head><body>
<div class="card">
<div class="brand"><div class="logo">AI</div><h1>AI Content Studio</h1><p>Sign in to your account</p></div>
<div class="tabs"><div class="tab active">Sign In</div><div class="tab">Register</div></div>
<input type="email" placeholder="you@example.com">
<input type="password" placeholder="Password">
<button>Sign In</button>
</div></body></html>
